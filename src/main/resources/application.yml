spring:
  application:
    name: test
  datasource:
    url: jdbc:mariadb://localhost:3306/springblogdb
    username: ucheck
    password: control1@
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        show_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    generate-ddl: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/session/jdbc/schema-mysql.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
